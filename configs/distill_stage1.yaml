experiment:
  name: stage1
  seed: 42
  output_root: runs

model:
  type: student
  stage: 1
  output_dim: 4096
  vlm_dim: 2048
  crossattn_heads: 16
  crossattn_every_n: 2
  crossattn_layer_mode: late_stride
  bank_size: 256
  router_dim: 512
  top_k: 8
  router_layers: [8, 12, 16, 20]
  ablation_mode: full
  memory_init: vlm_sample
  memory_init_tokens: 4096
  foundation_path: pretrained/dinov2_vitl14.pth
  teacher_path: checkpoints/teacher.pth
  initialization_path: null

data:
  gsv_root: data/gsv_cities
  train_vlm_cache: data/vlm/gsv
  benchmark_root: data/benchmarks
  train_resize: [224, 224]
  eval_resize: [322, 322]
  num_workers: 8
  images_per_place: 4

training:
  global_batch_size: 128
  epochs: 20
  patience: 12
  learning_rate: 0.0004
  optimizer: adam
  scheduler: cosine
  warmup_epochs: 1.0
  scheduler_epochs: 10
  min_lr_ratio: 0.05
  align_weight: 1.0
  metric_source: teacher_student
  log_pair_stats: true
  resume_path: null
  max_steps: null

evaluation:
  enabled: true
  dataset_name: pitts30k
  split: test
  batch_size: 32
  positive_distance: 25
  recall_values: [1, 5, 10, 100]
  test_method: hard_resize
